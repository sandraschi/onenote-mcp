[project]
name = "onenote-mcp"
version = "1.0.0"
description = "FastMCP 3.1.0+ server for Microsoft OneNote integration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Sandra Schi", email = "sandraschipal@gmail.com" }
]
keywords = [
    "mcp",
    "onenote",
    "microsoft",
    "graph",
    "model-context-protocol",
    "claude",
    "cursor",
    "fastmcp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "msal>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "prefab-ui>=0.14.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "ruff>=0.16.0,<0.17",
    "mypy>=1.10.0",
    "pre-commit>=4.6.1",
]

[project.scripts]
onenote-mcp = "onenote_mcp.server:main"

[project.urls]
Homepage = "https://github.com/sandraschi/onenote-mcp"
Repository = "https://github.com/sandraschi/onenote-mcp"
Documentation = "https://github.com/sandraschi/onenote-mcp#readme"
Issues = "https://github.com/sandraschi/onenote-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onenote_mcp"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# =============================================================================
# MCPB Configuration
# =============================================================================
[tool.mcpb]
name = "onenote-mcp"
description = "FastMCP server for Microsoft OneNote integration"
version = "1.0.0"

[tool.mcpb.server]
command = "python"
args = ["-m", "onenote_mcp.server"]

[tool.mcpb.env]
GRAPH_ACCESS_TOKEN = { default = "", description = "Microsoft Graph access token (optional, will use device code flow if not provided)" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S105", "S106", "S110", "S112", "S101", "B008", "S105", "S106", "S110", "S112", "RUF012", "S603", "S607", "S324", "E402", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "ruff>=0.16.0,<0.17",
    "mypy>=1.10.0",
    "pyright>=1.1.390",
    "pre-commit>=4.6.1",
]

[tool.ruff.lint.per-file-ignores]
"scripts/cua-smoke.py" = ["S310"]
